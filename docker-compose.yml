version: '3.8'

services:
  # MinIO для S3-совместимого хранилища
  minio:
    image: minio/minio:latest
    container_name: ml-model-service-minio
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 10s

  # инициализация бакетов MinIO
  minio-init:
    image: minio/mc:latest
    container_name: ml-model-service-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/ml-model-service --ignore-existing || true;
      mc mb myminio/mlflow-artifacts --ignore-existing || true;
      echo 'Бакеты созданы успешно';
      "

  # MLflow
  mlflow:
    image: python:3.10-slim
    container_name: ml-model-service-mlflow
    ports:
      - "5001:5000"
    environment:
      - MLFLOW_BACKEND_STORE_URI=sqlite:///mlflow/mlflow.db
      - MLFLOW_DEFAULT_ARTIFACT_ROOT=s3://mlflow-artifacts/
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - MLFLOW_DISABLE_REQUEST_LOGGING=true
      - MLFLOW_SERVER_ALLOWED_HOSTS=*
    volumes:
      - mlflow_data:/mlflow
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command: >
      sh -c "
      pip install --no-cache-dir mlflow boto3 &&
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --default-artifact-root s3://mlflow-artifacts/
      --serve-artifacts
      --workers 1
      "

  # API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ml-model-service-api
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-default-secret-key}
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - S3_ENABLED=true
      - S3_ENDPOINT=http://minio:9000
      - S3_REGION=us-east-1
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET=ml-model-service
      - S3_MODELS_PREFIX=models/
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_DEFAULT_REGION=us-east-1
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_EXPERIMENT_NAME=ml-model-service
    volumes:
      - ./trained_models:/app/trained_models
      - ./data:/app/data
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      mlflow:
        condition: service_started
    restart: unless-stopped

  # дашборд на Streamlit
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ml-model-service-dashboard
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000/api
    depends_on:
      api:
        condition: service_started
    command: >
      sh -c "
      streamlit run dashboard/dashboard.py
      --server.port 8501
      --server.address 0.0.0.0
      "
    restart: unless-stopped

volumes:
  minio_data:
    driver: local
  mlflow_data:
    driver: local